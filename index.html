<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lunch 巴士到站時間表</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0e6ed;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .header {
      background: #1a365d;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.85; }
    
    .select-container {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }
    .stop-select {
      background: white;
      color: #1a365d;
      border: 1px solid #cbd5e0;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }

    .update-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    .eta-list { padding: 16px; }
    .stop-group-title {
      font-size: 14px;
      font-weight: bold;
      color: #1a365d;
      margin: 16px 0 10px 4px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 6px;
    }
    .stop-group-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 14px;
      background: #3182ce;
      margin-right: 8px;
      border-radius: 2px;
    }
    .route-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fffdf0;
      border: 1.5px solid #ffd100;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .route-item.kmb {
      background: #fff5f5;
      border-color: #ff5252;
    }
    .route-badge { display: flex; flex-direction: column; align-items: flex-start; min-width: 65px; }
    .route-number { font-size: 20px; font-weight: 800; color: #1a365d; }
    .company-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-top: 2px; }
    .ctb-tag { background-color: #ffd100; color: #333; }
    .kmb-tag { background-color: #e60012; color: white; }
    
    .route-info { flex: 1; padding: 0 12px; }
    .dest-name { font-size: 14px; font-weight: bold; color: #2d3748; }
    .eta-times { text-align: right; min-width: 125px; }
    .primary-eta { font-size: 15px; font-weight: bold; color: #2b6cb0; }
    .secondary-eta { font-size: 11px; color: #718096; margin-top: 3px; }
    .status-msg { text-align: center; padding: 24px; color: #718096; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Lunch 巴士到站時間表</h1>
      <p>📍 選擇巴士站觀測全路線到站時間</p>

      <div class="select-container">
        <select id="stopSelector" class="stop-select" onchange="loadAllEta()">
          <option value="ALL">📍 所有車站 (一次看全部)</option>
          <option value="002439">銅鑼灣 - 希慎廣場, 軒尼詩道</option>
          <option value="002404">堅拿道巴士專用線</option>
          <option value="002383">業興街, 黃竹坑道</option>
        </select>
      </div>

      <button class="update-btn" onclick="loadAllEta()">🔄 更新到站時間</button>
    </div>

    <div class="eta-list" id="etaContainer">
      <div class="status-msg">正在載入班次...</div>
    </div>
  </div>

  <script>
    const TARGET_STOPS = [
      { id: '002439', name: '銅鑼灣 - 希慎廣場, 軒尼詩道', keywords: ['希慎', '軒尼詩道', '銅鑼灣'] },
      { id: '002404', name: '堅拿道巴士專用線', keywords: ['堅拿道', '鵝頸橋'] },
      { id: '002383', name: '業興街, 黃竹坑道', keywords: ['業興街', '黃竹坑'] }
    ];

    const ALL_ROUTES = [
      '37A', '38', '41A', '42', '42C', '47P', '70', '70P', '72', '72A', '73', '75', '76', '77', 
      '90', '90B', '96', '97', '99', '99X', '107', '107P', '170', '171', '171A', 
      '592', '671', '671X', '973', 'A17', 'N72'
    ];

    const JOINT_ROUTES = ['107', '107P', '170', '171', '171A', '671', '671X'];

    // 抓取城巴 ETA
    async function fetchCtbEta(stopId, route) {
      try {
        const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`);
        if (!res.ok) return [];
        const data = await res.json();
        return (data.data || []).filter(i => i.eta).map(i => ({
          ...i,
          co: 'CTB',
          dest_tc: i.dest_tc
        }));
      } catch (err) {
        return [];
      }
    }

    // 用九巴 Route-ETA API，免除站號不匹配的問題
    async function fetchKmbRouteEta(route, keywords) {
      try {
        // 向九巴查詢該路線（往沙田/九龍方向）
        const [res1, res2] = await Promise.all([
          fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/1`),
          fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/2`)
        ]);

        let combined = [];
        if (res1.ok) { const d1 = await res1.json(); if (d1.data) combined = combined.concat(d1.data); }
        if (res2.ok) { const d2 = await res2.json(); if (d2.data) combined = combined.concat(d2.data); }

        // 依車站名稱關鍵字過濾出目標站
        return combined.filter(item => {
          if (!item.eta) return false;
          const name = item.name_tc || '';
          return keywords.some(kw => name.includes(kw));
        }).map(item => ({
          ...item,
          co: 'KMB',
          dest_tc: item.dest_tc || '目的地'
        }));
      } catch (err) {
        return [];
      }
    }

    async function fetchStopAllRoutes(stopObj) {
      let fetchPromises = [];

      ALL_ROUTES.forEach(route => {
        // 查城巴
        fetchPromises.push(fetchCtbEta(stopObj.id, route));
        // 聯營過海線：用關鍵字向九巴全線 API 查
        if (JOINT_ROUTES.includes(route)) {
          fetchPromises.push(fetchKmbRouteEta(route, stopObj.keywords));
        }
      });

      const results = await Promise.all(fetchPromises);
      let combined = [];
      results.forEach(list => {
        combined = combined.concat(list);
      });
      return combined;
    }

    async function loadAllEta() {
      const container = document.getElementById('etaContainer');
      const selectedStopId = document.getElementById('stopSelector').value;
      const now = new Date();

      try {
        const filteredStops = selectedStopId === 'ALL' 
          ? TARGET_STOPS 
          : TARGET_STOPS.filter(s => s.id === selectedStopId);

        const promises = filteredStops.map(stopObj => fetchStopAllRoutes(stopObj));
        const results = await Promise.all(promises);

        let html = '';

        filteredStops.forEach((stop, index) => {
          const rawList = results[index] || [];

          html += `<div class="stop-group-title">${stop.name}</div>`;

          if (rawList.length > 0) {
            const routeMap = {};
            rawList.forEach(item => {
              if (!routeMap[item.route]) routeMap[item.route] = [];
              routeMap[item.route].push(item);
            });

            const routes = Object.keys(routeMap).sort((a, b) => parseInt(a) - parseInt(b));

            routes.forEach(routeName => {
              const matched = routeMap[routeName];
              matched.sort((a, b) => new Date(a.eta) - new Date(b.eta));

              const bus1 = matched[0];
              const bus2 = matched[1];

              const diff1 = Math.max(0, Math.round((new Date(bus1.eta) - now) / 60000));
              const timeStr1 = new Date(bus1.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

              let primaryStr = diff1 === 0 ? '即將到站' : `${diff1} 分鐘 <span style="font-size:11px;font-weight:normal;">(${timeStr1})</span>`;
              let secondEtaStr = '暫無次班';
              if (bus2 && bus2.eta) {
                const diff2 = Math.max(0, Math.round((new Date(bus2.eta) - now) / 60000));
                const timeStr2 = new Date(bus2.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                secondEtaStr = `次班: ${timeStr2} (${diff2}分)`;
              }

              const isKmb = bus1.co === 'KMB';
              const companyClass = isKmb ? 'kmb' : 'ctb';
              const tagText = isKmb ? '九巴' : '城巴';
              const tagClass = isKmb ? 'kmb-tag' : 'ctb-tag';

              html += `
                <div class="route-item ${companyClass}">
                  <div class="route-badge">
                    <span class="route-number">${routeName}</span>
                    <span class="company-tag ${tagClass}">${tagText}</span>
                  </div>
                  <div class="route-info">
                    <div class="dest-name">往 ${bus1.dest_tc || '目的地'}</div>
                  </div>
                  <div class="eta-times">
                    <div class="primary-eta">${primaryStr}</div>
                    <div class="secondary-eta">${secondEtaStr}</div>
                  </div>
                </div>
              `;
            });
          } else {
            html += `
              <div class="status-msg" style="padding: 12px; font-size: 13px;">
                暫無即時班次資料
              </div>
            `;
          }
        });

        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="status-msg">載入失敗，請稍後重試</div>`;
      }
    }

    loadAllEta();
    setInterval(loadAllEta, 15000);
  </script>
</body>
</html>
