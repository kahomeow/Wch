<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lunch 巴士時間表</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0e6ed;
      overflow: hidden;
    }
    .header {
      background: #1a365d;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.85; }
    .update-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    .eta-list { padding: 16px; }
    .stop-group-title {
      font-size: 13px;
      font-weight: bold;
      color: #4a5568;
      margin: 12px 0 8px 4px;
      display: flex;
      align-items: center;
    }
    .stop-group-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 12px;
      background: #3182ce;
      margin-right: 6px;
      border-radius: 2px;
    }
    .route-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fffdf0;
      border: 1.5px solid #ffd100;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .route-badge { display: flex; flex-direction: column; align-items: flex-start; min-width: 70px; }
    .route-number { font-size: 22px; font-weight: 800; color: #1a365d; }
    .company-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background-color: #ffd100; color: #333; font-weight: bold; margin-top: 2px; }
    .route-info { flex: 1; padding: 0 12px; }
    .stop-name { font-size: 14px; font-weight: bold; color: #2d3748; }
    .dest-name { font-size: 12px; color: #718096; margin-top: 2px; }
    .eta-times { text-align: right; min-width: 120px; }
    .primary-eta { font-size: 15px; font-weight: bold; color: #2b6cb0; }
    .secondary-eta { font-size: 11px; color: #718096; margin-top: 3px; }
    .status-msg { text-align: center; padding: 24px; color: #718096; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Lunch 時間表</h1>
      <p>城巴 38 號線 (往置富花園方向)</p>
      <button class="update-btn" onclick="loadAllEta()">🔄 更新到站時間</button>
    </div>

    <div class="eta-list" id="etaContainer">
      <div class="status-msg">正在載入班次...</div>
    </div>
  </div>

  <script>
    // 38 號線往置富方向 3 個目標車站 ID
    const STOPS = [
      { id: '002422', name: '銅鑼灣 - 希慎廣場', seq: 7 },
      { id: '002418', name: '堅拿道巴士專用線', seq: 8 },
      { id: '002235', name: '業興街, 黃竹坑道', seq: 13 }
    ];

    async function fetchStopEta(stopId) {
      try {
        const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/38`);
        if (!res.ok) return [];
        const data = await res.json();
        return (data.data || []).filter(i => i.eta);
      } catch (err) {
        return [];
      }
    }

    async function loadAllEta() {
      const container = document.getElementById('etaContainer');
      const now = new Date();

      try {
        const promises = STOPS.map(stop => fetchStopEta(stop.id));
        const results = await Promise.all(promises);

        let html = '';

        STOPS.forEach((stop, index) => {
          const matched = results[index] || [];

          html += `<div class="stop-group-title">${stop.name}</div>`;

          if (matched.length > 0) {
            matched.sort((a, b) => new Date(a.eta) - new Date(b.eta));
            const bus1 = matched[0];
            const bus2 = matched[1];

            const diff1 = Math.max(0, Math.round((new Date(bus1.eta) - now) / 60000));
            const timeStr1 = new Date(bus1.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let primaryStr = diff1 === 0 ? '即將到站' : `${diff1} 分鐘 <span style="font-size:11px;font-weight:normal;">(${timeStr1})</span>`;
            let secondEtaStr = '暫無次班';
            if (bus2 && bus2.eta) {
              const diff2 = Math.max(0, Math.round((new Date(bus2.eta) - now) / 60000));
              const timeStr2 = new Date(bus2.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              secondEtaStr = `次班: ${timeStr2} (${diff2}分)`;
            }

            html += `
              <div class="route-item">
                <div class="route-badge">
                  <span class="route-number">38</span>
                  <span class="company-tag">城巴</span>
                </div>
                <div class="route-info">
                  <div class="stop-name">${stop.name}</div>
                  <div class="dest-name">往 置富花園</div>
                </div>
                <div class="eta-times">
                  <div class="primary-eta">${primaryStr}</div>
                  <div class="secondary-eta">${secondEtaStr}</div>
                </div>
              </div>
            `;
          } else {
            html += `
              <div class="route-item" style="opacity:0.65;">
                <div class="route-badge">
                  <span class="route-number">38</span>
                  <span class="company-tag">城巴</span>
                </div>
                <div class="route-info">
                  <div class="stop-name">${stop.name}</div>
                  <div class="dest-name">往 置富花園</div>
                </div>
                <div class="eta-times">
                  <div class="primary-eta" style="color:#888;font-size:13px;">未有班次</div>
                  <div class="secondary-eta">---</div>
                </div>
              </div>
            `;
          }
        });

        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="status-msg">載入失敗，請稍後重試</div>`;
      }
    }

    loadAllEta();
    setInterval(loadAllEta, 15000);
  </script>
</body>
</html>
